id = "move-tab"
name = "Move Tab"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Shift the current tab left or right within its workspace, like tmux's swap-window."
platforms = ["linux", "macos"]

# Compiled at install time; produces a self-contained binary in the plugin
# root (Go stdlib only). For a linked dev copy, run this manually.
[[build]]
command = ["go", "build", "-o", "herdr-move-tab", "."]

[[actions]]
id = "left"
title = "Move Tab: left"
description = "Shift the current tab one slot left."
contexts = ["global", "workspace", "tab"]
command = ["./herdr-move-tab", "left"]

[[actions]]
id = "right"
title = "Move Tab: right"
description = "Shift the current tab one slot right."
contexts = ["global", "workspace", "tab"]
command = ["./herdr-move-tab", "right"]
